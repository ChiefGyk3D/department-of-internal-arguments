# SPDX-License-Identifier: MIT
version: 2
updates:
  # Every action is pinned to a commit with a version comment; Dependabot reads the comment and moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release that turns out to be malicious is usually pulled within days; waiting a week costs nothing.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]
