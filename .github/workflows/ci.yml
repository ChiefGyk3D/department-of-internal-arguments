# CI for department-of-internal-arguments. The jobs live in ChiefGyk3D/git-your-ship-together; this file
# says only what is specific to this repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@9e0d7b2e7e8530e2b1bb200ecb4fbf6de021881f # v1.38.0
    permissions:
      contents: read
      id-token: write   # declared by the shared python-ci workflow; checked statically, unused here
    with:
      # python-versions is left at the shared python-ci default (3.11 to 3.15) so this repo tests every Python GYST
      # supports. Drop dates (issue #81): 3.11 after 2027-10-31, 3.12 after 2028-10-31, 3.13 after 2029-10-31.
      install-command: |
        python -m pip install --upgrade pip
        pip install pytest 'pyyaml==6.0.3'   # pyyaml: test-only, compares the front matter check with a real loader
      test-command: |
        python scripts/generate.py --check
        python scripts/gen_wiki.py --check
        python scripts/validate.py
        pytest
      lint-install-command: |
        pip install "ruff==0.16.9"
      lint-command: |
        ruff check .
        ruff format --check .
      docker-build: false
      egress-policy: block
