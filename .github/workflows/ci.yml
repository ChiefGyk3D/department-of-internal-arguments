# CI for department-of-internal-arguments. The jobs live in ChiefGyk3D/git-your-ship-together; this file
# says only what is specific to this repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@faba0b7d1ab65e9033bef1acfa93d6d57b5808c0 # v1.21.0
    permissions:
      contents: read
      id-token: write   # declared by the shared python-ci workflow; checked statically, unused here
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      install-command: |
        python -m pip install --upgrade pip
        pip install pytest
      test-command: |
        python scripts/generate.py --check
        python scripts/validate.py
        pytest
      lint-install-command: |
        pip install "ruff==0.16.9"
      lint-command: |
        ruff check .
        ruff format --check .
      docker-build: false
      egress-policy: block
